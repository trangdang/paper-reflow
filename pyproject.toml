[project]
name = "paper-reflow"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.28.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.14.0",
]

[tool.pytest.ini_options]
filterwarnings = [
    # PyMuPDF's SWIG bindings emit these on import under newer Python; the
    # noise is entirely inside the dependency and not actionable here.
    "ignore:builtin type Swig.*has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
